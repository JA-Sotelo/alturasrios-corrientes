# Actualiza la copia de datos de Prefectura desde la nube de GitHub,
# sin depender de una PC encendida. Corre cada 30 minutos y también a pedido.
name: Actualizar datos PNA

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write             # necesario para subir la copia al repositorio

concurrency:
  group: datos-pna            # evita dos ejecuciones simultáneas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Consultar Prefectura y publicar si hay datos nuevos
        run: python actualizar_datos.py
